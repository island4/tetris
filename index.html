<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="shortcut icon" href="icon.ico" />
    <link rel="apple-touch-icon" href="icon.ico" />
    <title>Tetris</title>
  </head>
  <body>
    <div id="deviceTest"></div>
    <div class="box" id="container">
      <div class="box" id="hold-box">
        <div class="hold-text">hold</div>
        <div id="hold-board"></div>
        <div class="information">
          <div>level</div>
          <div>line</div>
          <div>score</div>
        </div>
      </div>
      <div class="box" id="game-board"></div>
      <div class="box" id="next-box">
        <div class="next-text">next</div>
        <div id="next-board"></div>
      </div>
    </div>
    <div class="box" id="button-box">
      <div class="box" id="left-btn">
        <button class="control-btn">1</button>
        <button class="control-btn">2</button>
        <button class="control-btn">3</button>
        <button class="control-btn">4</button>
      </div>
      <div class="box" id="right-btn">
        <button class="control-btn">5</button>
        <button class="control-btn">6</button>
        <button class="control-btn">7</button>
        <button class="control-btn">8</button>
      </div>
    </div>
  </body>
  <script src="./hold.js" type="module" defer></script>
  <script src="./main.js" type="module" defer></script>
  <script src="./mobile.js" defer></script>
</html>
